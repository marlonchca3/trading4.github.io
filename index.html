<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juego de Patrones de Velas</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">
  <div class="game-layout">
    <div class="left-panel">
      <div id="timer">Tiempo: 15s</div>

      <img id="imagen" class="game-image" src="" alt="patrón">
    </div>

    <div class="right-panel">
      <div id="pregunta"></div>

      <div id="opciones" class="opciones-container"></div>

      <div class="top-info">
        <h1>🎯 Juego de Patrones de Velas</h1>
        <p>Puntaje: <span id="score">0</span> / 50 | Pregunta: <span id="preguntaActual">1</span> / 100</p>
      </div>

      <p id="resultado"></p>
    </div>
  </div>
  
  <div id="reinicioContainer">
    <button id="reiniciarBtn" class="reiniciar-btn">🔄 Reiniciar Juego</button>
  </div>
</div>

<div id="animacionVictoria" class="victoria-overlay">
    <h1 class="victoria-titulo">🎉 ¡FELICITACIONES! 🎉</h1>
    <p class="victoria-texto">¡Has alcanzado los 50 puntos!</p>
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExZ2VudWF6a2V1MjlxeWl0Ynd2Z3d0YW8yejZ0ajJvbjh6cWk3bW04cCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/PZWaW6S6waf2kiv4hI/giphy.gif" alt="Cohetes">
</div>

<script src="script.js"></script>
</body>
</html>
