
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juego de Patrones de Velas</title>


<style>
  :root {
    --bg: #081120;
    --card: rgba(15, 23, 42, 0.92);
    --card-border: rgba(96, 165, 250, 0.25);
    --text: #e5eefc;
    --muted: #b6c2df;
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --success: #10b981;
    --warning: #fbbf24;
    --danger: #ef4444;
    --shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 18px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    font-family: "Segoe UI", Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at top, rgba(59, 130, 246, 0.22), transparent 35%),
      linear-gradient(135deg, #020617, #0f172a 55%, #111827);
  }

  .container {
    width: 100%;
    max-width: 1220px;
    padding: 20px;
    border-radius: 22px;
    border: 1px solid var(--card-border);
    background: var(--card);
    box-shadow: var(--shadow);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
  }

  h1 {
    margin: 0;
    text-align: center;
    font-size: clamp(1.3rem, 2.3vw, 1.8rem);
    color: #f8fafc;
  }

  p {
    margin: 0;
    text-align: center;
    color: var(--muted);
    line-height: 1.4;
    font-size: 0.9rem;
  }

  .top-info {
    width: 100%;
    padding: 14px 16px;
    margin-top: 6px;
    border-radius: 16px;
    border: 1px solid var(--card-border);
    background: rgba(15, 23, 42, 0.94);
    box-shadow: var(--shadow);
  }

  .top-info h1,
  .top-info p {
    text-align: center;
  }

  .game-layout {
    display: grid;
    grid-template-columns: minmax(0, 1.7fr) minmax(220px, 0.72fr);
    gap: 16px;
    align-items: start;
  }

  .left-panel,
  .right-panel {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  #score,
  #preguntaActual {
    color: #fde047;
    font-weight: 700;
  }

  #timer {
    width: 100%;
    padding: 10px 14px;
    text-align: center;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--warning);
    background: rgba(251, 191, 36, 0.12);
    border: 1px solid rgba(251, 191, 36, 0.3);
    border-radius: 12px;
  }

  #pregunta {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(30, 41, 59, 0.9);
    color: #f8fafc;
    font-size: 0.92rem;
    font-weight: 600;
    text-align: left;
  }

  img {
    width: 100%;
    height: auto;
    max-height: 760px;
    object-fit: contain;
    border-radius: 16px;
    margin: 6px 0;
    padding: 8px;
    background: linear-gradient(180deg, #ffffff, #e2e8f0);
    border: 1px solid rgba(148, 163, 184, 0.35);
  }

  .opciones-container {
    width: 100%;
    display: grid;
    gap: 8px;
    margin: 6px 0 0;
  }

  button {
    width: 100%;
    padding: 8px 11px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    text-align: left;
    background: linear-gradient(135deg, var(--primary), var(--primary-hover));
    color: white;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.1px;
    box-shadow: 0 10px 20px rgba(37, 99, 235, 0.25);
    transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
  }

  button:hover {
    transform: translateY(-1px);
    filter: brightness(1.05);
    box-shadow: 0 14px 24px rgba(37, 99, 235, 0.32);
  }

  button:active {
    transform: scale(0.98);
  }

  button:disabled {
    cursor: not-allowed;
    opacity: 0.7;
    box-shadow: none;
  }

  button.correcta {
    background: linear-gradient(135deg, #10b981, #059669) !important;
    opacity: 1;
  }

  button.incorrecta {
    background: linear-gradient(135deg, #facc15, #eab308) !important;
    color: #111827;
    opacity: 1;
  }

  #resultado {
    min-height: 28px;
    font-size: 0.9rem;
    font-weight: 700;
    text-align: left;
  }

  #reinicioContainer {
    width: 100%;
  }

  @media (max-width: 640px) {
    body {
      padding: 10px;
    }

    .top-info {
      position: static;
      width: 100%;
      margin-bottom: 12px;
    }

    .game-layout {
      grid-template-columns: 1fr;
    }

    .top-info h1,
    .top-info p,
    #pregunta,
    #resultado,
    button,
    #timer {
      text-align: center;
    }

    .container {
      padding: 16px;
      border-radius: 16px;
    }

    button {
      font-size: 0.96rem;
    }
  }
</style>


</head>

<body>
<div class="container">
  <div class="game-layout">
    <div class="left-panel">
      <div id="timer">Tiempo: 15s</div>

      <img id="imagen" src="" alt="patrón" style="max-height: 760px;">
    </div>

    <div class="right-panel">
      <div id="pregunta"></div>

      <div id="opciones" class="opciones-container"></div>

      <div class="top-info">
        <h1>🎯 Juego de Patrones de Velas</h1>
        <p>Puntaje: <span id="score">0</span> / 50 | Pregunta: <span id="preguntaActual">1</span> / 100</p>
      </div>

      <p id="resultado"></p>
    </div>
  </div>
  
  <div id="reinicioContainer" style="display: none;">
    <button id="reiniciarBtn" onclick="reiniciarJuego()" style="background: #10b981; font-size: 18px; padding: 12px 20px; margin-top: 20px;">🔄 Reiniciar Juego</button>
  </div>
</div>


<div id="animacionVictoria" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:999; text-align:center; padding-top:20%;">
    <h1 style="color:#fbbf24; font-size: 50px;">🎉 ¡FELICITACIONES! 🎉</h1>
    <p style="font-size: 30px;">¡Has alcanzado los 50 puntos!</p>
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExZ2VudWF6a2V1MjlxeWl0Ynd2Z3d0YW8yejZ0ajJvbjh6cWk3bW04cCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/PZWaW6S6waf2kiv4hI/giphy.gif" alt="Cohetes">
</div>


<script>
const patrones = [
  
 
  {
    img: "fotos/2.jpg",
    pregunta: "¿Qué patron es el 1 ?",
    correcto: "Empanada superior",
    opciones: ["Empanada superior", "Pendiente descendente", "Triángulo"]
  },

  {
    img: "fotos/3.jpg",
    pregunta: "¿Qué patrón es el 1 ?",
    correcto: "Empanada superior",
    opciones: ["Cielo negro cubierto", "Empanada superior", "Envolvente alcista"]
  },

  {
    img: "fotos/5.jpg",
    pregunta: "¿Qué patrónes es el 1 ?",
    correcto: "Fondo del sarten",
    opciones: ["Cielo negro cubierto", "Doble Techo", "Fondo del sarten"]
  },

  {
    img: "fotos/6.jpg",
    pregunta: "¿Qué patrónes es el 1 ?",
    correcto: "Fondo del sarten",
    opciones: ["Fondo del sarten", "Encima del soporte", "Encima de la resistencia"]
  },

 {
    img: "fotos/7.jpg",
    pregunta: "¿Qué patrón es el 3 ?",
    correcto: "Fondo redondeado",
    opciones: ["Cielo negro cubierto", "Doble Techo", "Fondo redondeado"]
  },
  {
    img: "fotos/8.jpg",
    pregunta: "¿Qué patrón es el 3?",
    correcto: "Empanada superior",
    opciones: ["Empanada superior", "Cielo negro cubierto", "Bandera"]
  },
  {
    img: "fotos/9.jpg",
    pregunta: "¿Qué patrónes es el 1?",
    correcto: "Torre superior",
    opciones: ["Breakout", "Torre superior", "Pullback"]
  },
  {
    img: "fotos/10.jpg",
    pregunta: "¿Qué patrónes es el 1",
    correcto: "Torre inferior",
    opciones: ["Patrón salido", "Patrón cubierto", "Torre inferior"]
  },

  {
    img: "fotos/11.jpg",
    pregunta: "¿Qué patrónes es el 1",
    correcto: "Torre inferior",
    opciones: ["Torre inferior", "Patrón cubierto", "Patrón penetrante"]
  },

  {
    img: "fotos/12.jpg",
    pregunta: "¿Qué patrónes es el 1",
    correcto: "Torre inferior",
    opciones: ["Patrónes de empuje", "Torre inferior", "Patrón penetrante"]
  },

  {
    img: "fotos/13.jpg",
    pregunta: "¿Qué patrónes es el 1",
    correcto: "ventana creciente",
    opciones: ["Patrónes de empuje", "Estrella de la mañana", "ventana creciente"]
  },

  {
    img: "fotos/14.jpg",
    pregunta: "¿en este grafico que es bottom window",
    correcto: "Soporte",
    opciones: ["Soporte", "Patrón cubierto", "Estrella de la mañana"]
  },

  {
    img: "fotos/15.jpg",
    pregunta: "¿Qué patrónes es el 1",
    correcto: "Ventana decreciente",
    opciones: ["Patrónes de empuje", "Ventana decreciente", "Estrella de la mañana"]
  }  ,

  {
    img: "fotos/16.jpg",
    pregunta: "¿Qué patrónes es el 3",
    correcto: "Ventanas decrecientes",
    opciones: ["Patrónes de empuje", "Patrón cubierto", "Ventanas decrecientes"]
  }  ,

  {
    img: "fotos/17.jpg",
    pregunta: "¿Qué patrónes es el 1",
    correcto: "Ventana decreciente",
    opciones: ["Ventana decreciente", "Patrón cubierto", "Estrella de la noche"]
  }  ,

  {
    img: "fotos/18.jpg",
    pregunta: "¿Qué sonlos patrónes del 1-6",
    correcto: "Ventanas ascendentes",
    opciones: ["Patrónes de empuje", "Ventanas ascendentes", "Estrella de la mañana doji"]
  }  ,

  {
    img: "fotos/19.jpg",
    pregunta: "¿Como actuan cada una de las ventanas ascendesntes del 1-4",
    correcto: "Como soporte",
    opciones: ["Como patrónes de empuje", "Como patrón cubierto", "Como soporte"]
  }  ,

  {
    img: "fotos/20.jpg",
    pregunta: "¿Qué patrónes es el 1",
    correcto: "Tasuki con gap ascendente",
    opciones: ["Tasuki con gap ascendente", "Bebe abandonado en techo", "Estrella de la mañana"]
  }
  
];

let indice = 0;
let score = 0;
let preguntasHechas = 0;
let tiempoRestante = 0;
let timerInterval = null;
let patronActual = null;
let audioCtx = null;

function obtenerAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }
  return audioCtx;
}

function reproducirSonidoCorrecto() {
  const ctx = obtenerAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = "sine";
  osc.frequency.setValueAtTime(880, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.15);
  gain.gain.setValueAtTime(0.0001, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.16, ctx.currentTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.22);

  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.22);
}

function reproducirSonidoIncorrecto() {
  const ctx = obtenerAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = "triangle";
  osc.frequency.setValueAtTime(320, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.22);
  gain.gain.setValueAtTime(0.0001, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.14, ctx.currentTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.26);

  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.26);
}

function obtenerPatronAleatorio() {
  return patrones[Math.floor(Math.random() * patrones.length)];
}

function iniciarTemporizador() {
  tiempoRestante = 15;
  actualizarTemporizador();
  
  timerInterval = setInterval(() => {
    tiempoRestante--;
    actualizarTemporizador();
    
    if (tiempoRestante <= 0) {
      clearInterval(timerInterval);
      document.getElementById("resultado").textContent = "⏰ Tiempo agotado. Era: " + patronActual.correcto;
      reproducirSonidoIncorrecto();
      deshabilitarBotones();
      preguntasHechas++;
      
      if (preguntasHechas < 100) {
        setTimeout(cargarPatron, 2000);
      } else {
        mostrarFinal();
      }
    }
  }, 1500);
}

function actualizarTemporizador() {
  document.getElementById("timer").textContent = `Tiempo: ${tiempoRestante}s`;
  if (tiempoRestante <= 3) {
    document.getElementById("timer").style.color = "#ef4444";
  } else {
    document.getElementById("timer").style.color = "#fbbf24";
  }
}

function deshabilitarBotones() {
  const botones = document.querySelectorAll(".opciones-container button");
  botones.forEach(btn => btn.disabled = true);
}

function cargarPatron() {
  clearInterval(timerInterval);
  
  const p = obtenerPatronAleatorio();
  patronActual = p;
  document.getElementById("imagen").src = p.img;
  document.getElementById("pregunta").textContent = p.pregunta;
  document.getElementById("preguntaActual").textContent = preguntasHechas + 1;
  const opcionesDiv = document.getElementById("opciones");
  opcionesDiv.innerHTML = "";
  document.getElementById("resultado").textContent = "";

  p.opciones.forEach(op => {
    const btn = document.createElement("button");
    btn.textContent = op;
    btn.onclick = () => verificar(op, btn);
    btn.disabled = false;
    opcionesDiv.appendChild(btn);
  });
  
  iniciarTemporizador();
}

function verificar(respuesta, botonSeleccionado) {
  clearInterval(timerInterval);
  deshabilitarBotones();
  
  const resultado = document.getElementById("resultado");
  const botones = document.querySelectorAll(".opciones-container button");

  if (respuesta === patronActual.correcto) {
    botonSeleccionado.classList.add("correcta");
    resultado.textContent = "✅ Correcto!";
    reproducirSonidoCorrecto();
    score++;
    document.getElementById("score").textContent = score;


    // --- NUEVA LÓGICA DE VICTORIA ---
    if (score === 50) {
      mostrarVictoria();
      return; // Salimos para no seguir con la siguiente pregunta
    }


  } else {
    botonSeleccionado.classList.add("incorrecta");
    reproducirSonidoIncorrecto();
    botones.forEach(btn => {
      if (btn.textContent === patronActual.correcto) {
        btn.classList.add("correcta");
      }
    });
    resultado.textContent = "❌ Incorrecto. Era: " + patronActual.correcto;
  }

  preguntasHechas++;
  
  if (preguntasHechas < 100) {
    setTimeout(cargarPatron, 2000);
  } else {
    mostrarFinal();
  }
}


function mostrarVictoria() {
  const anim = document.getElementById("animacionVictoria");
  anim.style.display = "block";
  
  // Esperar 6 segundos y reiniciar
  setTimeout(() => {
    anim.style.display = "none";
    reiniciarJuego();
  }, 6000);
}

function mostrarFinal() {
  setTimeout(() => {
    document.getElementById("resultado").textContent = `🎉 ¡Juego terminado! Puntaje final: ${score}/100`;
    document.getElementById("reinicioContainer").style.display = "block";
    document.getElementById("imagen").style.display = "none";
    document.getElementById("pregunta").style.display = "none";
    document.getElementById("opciones").style.display = "none";
    document.getElementById("timer").style.display = "none";
  }, 500);
}

function reiniciarJuego() {
  indice = 0;
  score = 0;
  preguntasHechas = 0;
  tiempoRestante = 0;
  clearInterval(timerInterval);
  
  document.getElementById("score").textContent = "0";
  document.getElementById("preguntaActual").textContent = "1";
  document.getElementById("resultado").textContent = "";
  document.getElementById("imagen").style.display = "block";
  document.getElementById("pregunta").style.display = "block";
  document.getElementById("opciones").style.display = "flex";
  document.getElementById("timer").style.display = "block";
  document.getElementById("reinicioContainer").style.display = "none";
  
  cargarPatron();
}

cargarPatron();
</script>
</body>
</html>
